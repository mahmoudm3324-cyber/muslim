<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>فحص المسلم</title>
<style>body{font:15px/1.6 -apple-system,system-ui,sans-serif;margin:0;padding:16px;background:#f4f7f6;color:#123}h1{font-size:19px;margin:0 0 8px}h2{font-size:16px;margin:14px 0 4px}.r{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;margin:5px 0;background:#fff;border-radius:10px;font-size:13px;word-break:break-all}.ok{color:#0a7a3d;font-weight:700}.no{color:#c62828;font-weight:700}iframe{width:1px;height:1px;border:0;position:absolute;left:-9px;top:0}</style></head><body>
<h1>فحص تطبيق المسلم (2)</h1><div id="o"></div>
<script>
const o=document.getElementById('o');
function row(k,v,ok){const d=document.createElement('div');d.className='r';d.innerHTML='<span>'+k+'</span><span class="'+(ok===true?'ok':ok===false?'no':'')+'">'+v+'</span>';o.appendChild(d);}
function h2(t){const e=document.createElement('h2');e.textContent=t;o.appendChild(e);}
const base=location.href.replace(/[^\/]*$/,'');
row('الرابط',base);row('innerHeight / screen',innerHeight+' / '+screen.height);
row('standalone',String(navigator.standalone===true||matchMedia('(display-mode: standalone)').matches));
row('iOS',navigator.userAgent.replace(/.*OS ([\d_]+).*/,'$1'));
(async()=>{
 const html=await (await fetch(base+'index.html',{cache:'no-store'})).text();
 row('النسخة (sw.js)',(await (await fetch(base+'sw.js',{cache:'no-store'})).text()).match(/V='([^']+)'/)?.[1]||'?');
 const core=await (await fetch(base+'js/core.js',{cache:'no-store'})).text();
 row('إصلاح الشريط الأبيض موجود في core.js',String(/ios-sa/.test(core)),/ios-sa/.test(core));
 const css=await (await fetch(base+'css/base.css',{cache:'no-store'})).text();
 row('إصلاح الشريط الأبيض موجود في base.css',String(/fill-available/.test(css)),/fill-available/.test(css));
 h2('فحص أخطاء ملفات الجافاسكربت');
 const urls=[...html.matchAll(/<script[^>]+src="([^"]+)"/g)].map(m=>m[1]).filter(u=>!/^https?:/.test(u));
 let bad=0;
 for(const u of urls){try{const t=await (await fetch(base+u.split('?')[0],{cache:'no-store'})).text();try{new Function(t);}catch(e){bad++;row(u,'خطأ صياغة: '+e.message,false);}}catch(e){bad++;row(u,'مش متحمّل',false);}}
 row('عدد الملفات',urls.length+' (الأخطاء: '+bad+')',bad===0);
 h2('تشغيل التطبيق نفسه وجمع الأخطاء');
 const errs=[];const f=document.createElement('iframe');f.src=base+'index.html?diag='+Date.now();document.body.appendChild(f);
 const t0=Date.now();const iv=setInterval(()=>{try{const w=f.contentWindow;if(w&&w.document&&!w.__hk){w.__hk=1;w.addEventListener('error',e=>errs.push((e.message||'')+' @'+(e.filename||'').split('/').pop()+':'+e.lineno));w.addEventListener('unhandledrejection',e=>errs.push('promise: '+(e.reason&&e.reason.message||e.reason)));}}catch(e){}if(Date.now()-t0>1500)clearInterval(iv);},5);
 setTimeout(()=>{const w=f.contentWindow;let M=w.M;row('التطبيق اتحمّل (M)',String(!!M),!!M);try{row('عدد الأزرار/الأقسام في الصفحة',String(w.document.querySelectorAll('button,[onclick]').length));row('الشاشة الرئيسية ظهرت',String(!!w.document.querySelector('#app *')),!!w.document.querySelector('#app *'));const a=w.document.getElementById('app');row('ارتفاع #app',a?a.getBoundingClientRect().height+'':'—');}catch(e){row('قراءة التطبيق',e.message,false);}
  row('أخطاء وقت التشغيل',errs.length?'':'لا يوجد',errs.length===0);errs.slice(0,12).forEach(e=>row('•',e,false));},9000);
})();
</script></body></html>
